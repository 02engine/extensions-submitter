[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Cap 人机验证的边缘函数端点（精确路由，避免与 /assets/cap/* 静态资源抢占 namespace）
[[edge_functions]]
  path = "/cap/challenge"
  function = "cap"

[[edge_functions]]
  path = "/cap/redeem"
  function = "cap"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
