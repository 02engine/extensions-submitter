[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Cap 人机验证的边缘函数端点（/cap/challenge、/cap/redeem）
[[edge_functions]]
  path = "/cap/*"
  function = "cap"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
